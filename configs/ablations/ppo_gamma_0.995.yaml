# PPO axis D — discount factor (긴 시야).
# 효과: γ 0.99 → 0.995 → 유효 시야 ~100 → ~200 step 으로 확장.
#       Breakout 처럼 벽돌을 꾸준히 깨야 점수가 누적되는 장기 신용할당에 유리할 수 있으나
#       value 추정 분산↑ 로 학습이 불안정해질 수도 있음.
# 근거: γ 는 credit assignment horizon 을 직접 정하는 표준 축. 0.99 의 한 단계 위를 본다.
inherits: ../ppo.yaml

algo:
  kwargs:
    gamma: 0.995
