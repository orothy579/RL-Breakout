# Double DQN (van Hasselt et al., AAAI 2016)
# Single-variable change vs. baseline: the bootstrap target decouples action
# SELECTION (online net argmax) from action EVALUATION (target net), which
# reduces DQN's Q-value over-estimation. Implemented in src/algos/dqn.py
# (DoubleDQN.train). All other hyper-parameters are inherited unchanged.
inherits: dqn_baseline.yaml

algo:
  features:
    double_q: true
