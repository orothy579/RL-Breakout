# Dueling DQN (Wang et al., ICML 2016)
# Single-variable change vs. baseline: split the shared CNN features into a
# state-value head V(s) and an advantage head A(s,a), recombined as
#   Q(s,a) = V(s) + (A(s,a) - mean_a A(s,a)).
# Implemented in src/algos/dueling.py. All other hyper-parameters inherited.
inherits: dqn_baseline.yaml

algo:
  features:
    dueling: true
  kwargs:
    policy_kwargs:
      # Hidden width of each dueling stream; 512 follows Wang et al. (2016).
      net_arch: [512]
