# PPO (Schulman et al., 2017) — on-policy comparison algorithm.
# Same baseline preprocessing / seeding / evaluation protocol as DQN, so the
# value-based vs. policy-gradient comparison is fair. Hyper-parameters are the
# standard SB3 / OpenAI-baselines Atari PPO recipe.

algo:
  name: ppo
  features: {}
  kwargs:
    policy: CnnPolicy
    learning_rate: 2.5e-4   # standard Atari PPO LR (higher than DQN: on-policy, fresh data)
    n_steps: 128            # rollout length per env; n_envs * n_steps = 8 * 128 = 1024 steps/update
    batch_size: 256         # minibatch the 1024-step rollout is split into (4 minibatches)
    n_epochs: 4             # reuse each rollout for 4 optimization passes
    gamma: 0.99             # discount (matches DQN)
    gae_lambda: 0.95        # GAE bias/variance trade-off (Schulman et al., 2016)
    clip_range: 0.1         # PPO ratio clip; 0.1 is the conservative Atari value
    ent_coef: 0.01          # entropy bonus -> keeps exploration alive
    vf_coef: 0.5            # value-loss weight (standard PPO)
    max_grad_norm: 0.5      # gradient clipping for stability

env:
  env_id: ALE/Breakout-v5
  n_envs: 8
  frame_stack: 4
  env_kwargs:
    frameskip: 1
    repeat_action_probability: 0.0
    full_action_space: false
  wrapper_kwargs:
    terminal_on_life_loss: true   # TRAIN: denser signal (DeepMind protocol)
    clip_reward: true             # TRAIN: clipped rewards for stable advantages

eval_env:
  n_envs: 1
  wrapper_kwargs:
    terminal_on_life_loss: false  # EVAL: full-episode real game
    clip_reward: false            # EVAL: true unclipped score

train:
  total_timesteps: 10000000  # same 10M budget as every other config
  checkpoint_freq: 1000000
  eval_freq: 1000000
  n_eval_episodes: 3
